<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello Friend</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="logo">🙂</div>
    <h1>Hello Friend</h1>
    <p class="subtitle">Write something to your future self.</p>
    <div class="form-group">
      <textarea id="messageInput" placeholder="e.g. Don't man, you are above this." maxlength="200" rows="4"></textarea>
      <div class="char-count"><span id="charCount">0</span>/200</div>
    </div>
    <button id="saveBtn">Save</button>
    <div id="savedMsg" class="saved-msg">Saved ✓</div>
    <p class="tip">Write this when you're thinking clearly.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
